name: TLoot
version: ${project.version}
main: com.tloot.TLoot
api-version: '26.2'
author: liuxingyu2001
description: 寻宝插件 - 玩家发起寻宝，其他玩家参与寻宝
depend:
  - Vault
softdepend:
  - LiuChat

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.3.0
  - redis.clients:jedis:5.1.0

commands:
  treasure:
    description: 寻宝系统主命令
    usage: /treasure [create|join|list|info|reload]
    aliases: [tloot, t]

permissions:
  tloot.admin:
    description: 管理员权限
    default: op
